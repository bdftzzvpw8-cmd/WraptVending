[build]
# build.mjs copies only the public site into dist/ (never node_modules, package files, this file or _private/)
command = "node build.mjs"
publish = "dist"
functions = "netlify/functions"

# working files (checklists, patch tooling) live in _private/ and must never be served
[[redirects]]
from = "/_private/*"
to = "/404.html"
status = 404
force = true

# function source is deployed as functions, never served as files
[[redirects]]
from = "/netlify/*"
to = "/404.html"
status = 404
force = true

[[headers]]
for = "/*"

  [headers.values]
  X-Frame-Options = "DENY"
  X-Content-Type-Options = "nosniff"
  Referrer-Policy = "strict-origin-when-cross-origin"
  Permissions-Policy = "camera=(self), microphone=(), geolocation=(self)"
  Strict-Transport-Security = "max-age=31536000; includeSubDomains"
  # One policy for the whole site (Netlify would enforce two overlapping policies as their intersection).
  # Origins in use: Google Fonts everywhere; Command's map loads Leaflet from cdnjs and tiles from OpenStreetMap.
  # Inline <script>/handlers exist on every page, so 'unsafe-inline' stays; the win is no other script/connect
  # origins, no plugins, no <base> hijack, forms post only here, and no framing.
  Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://tile.openstreetmap.org https://cdnjs.cloudflare.com; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"

# the field CRM and the private tools: never cached by the CDN, never indexed
[[headers]]
for = "/command.html"

  [headers.values]
  Cache-Control = "no-store"
  X-Robots-Tag = "noindex, nofollow"

# same page via its pretty URL
[[headers]]
for = "/command"

  [headers.values]
  Cache-Control = "no-store"
  X-Robots-Tag = "noindex, nofollow"

[[headers]]
for = "/brand-guide.html"

  [headers.values]
  X-Robots-Tag = "noindex, nofollow"

[[headers]]
for = "/command-manifest.json"

  [headers.values]
  X-Robots-Tag = "noindex, nofollow"

[[headers]]
for = "/proposal.html"

  [headers.values]
  X-Robots-Tag = "noindex, nofollow"

[[headers]]
for = "/wrap-studio.html"

  [headers.values]
  X-Robots-Tag = "noindex, nofollow"

[[headers]]
for = "/sw.js"

  [headers.values]
  Cache-Control = "no-cache"

[[headers]]
for = "/.netlify/functions/*"

  [headers.values]
  Cache-Control = "no-store"

# file names aren't fingerprinted, so no "immutable": a day fresh, then served stale while it revalidates
[[headers]]
for = "/img/*"

  [headers.values]
  Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

# social crawlers keep their own copy; keep ours short so a replaced image shows up within a day
[[headers]]
for = "/og.png"

  [headers.values]
  Cache-Control = "public, max-age=86400"

# --- wrapt agents (added by setup.mjs) ---
[functions."agents-run-background"]
  node_bundler = "esbuild"
[functions."agents-daily"]
  node_bundler = "esbuild"
[functions."brief"]
  node_bundler = "esbuild"
[functions."inbox"]
  node_bundler = "esbuild"
[functions."inbox-worker-background"]
  node_bundler = "esbuild"
[functions."inbox-queue"]
  node_bundler = "esbuild"
[functions."note-ai"]
  node_bundler = "esbuild"
[functions."photo-ai"]
  node_bundler = "esbuild"
[functions."ack"]
  node_bundler = "esbuild"
# --- /wrapt agents ---
